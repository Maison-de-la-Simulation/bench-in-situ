# case batch strong or weak
CASE_BATCH=strong

# GPU TYPE
GPU_ARCH=V100
GPU_MEM=16G

# init launcher name
LAUNCH_NAME=template_launcher.sh

# size of physical domain in 1D (local for weak scaling and  global for strong scaling)
CUBE_SIZE=16

# vector of nb of gpu
SIMU_SIZEs=( 1 )

# domain decomposition
declare -A tab_repart=(
        ['1']=" 1 1 1 "
        ['2']=" 2 1 1 "
        ['4']=" 2 2 1 "
        ['8']=" 2 2 2 "
        ['16']=" 4 2 2 "
        ['32']=" 4 4 2 "
        ['64']=" 4 4 4 "
        ['128']=" 8 4 4 "
        ['256']=" 8 8 4 "
    )


