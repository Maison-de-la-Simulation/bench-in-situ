# case batch strong or weak
CASE_BATCH=weak

# GPU TYPE
GPU_ARCH=V100
GPU_MEM=32G

# init launcher name
LAUNCH_NAME=template_launcher.sh

# size of physical domain in 1D (local for weak scaling and global for strong scaling)
CUBE_SIZE=8
CUBE_SIZE_ARRAY=( 368 )

# vector of nb of gpus
SIMU_SIZE_ARRAY=( 1 2 4 8 16 32 64 )

# domain decomposition
declare -A domain_decomposition_for_each_simulation_size=(
        ['1']=" 1 1 1 "
        ['2']=" 2 1 1 "
        ['4']=" 2 2 1 "
        ['8']=" 2 2 2 "
        ['16']=" 4 2 2 "
        ['32']=" 4 4 2 "
        ['64']=" 4 4 4 "
        ['128']=" 8 4 4 "
        ['256']=" 8 8 4 "
    )


